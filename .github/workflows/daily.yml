name: daily-picks
on:
  schedule:
    - cron: "0 8 * * *"      # 08:00 UTC = 08:00 Ghana time, every day
  workflow_dispatch: {}       # lets you press "Run workflow" by hand
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build today's picks
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python run.py
      - name: Save results
        run: |
          git config user.name "picks-bot"
          git config user.email "picks-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Daily picks"
          git push
