name: fd-daily-picks
on:
  schedule:
    - cron: "0 7 * * *"      # 07:00 UTC = 07:00 Ghana time, every day
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the shortlist
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fd_run.py
      - name: Save results
        run: |
          git config user.name "picks-bot"
          git config user.email "picks-bot@users.noreply.github.com"
          git add docs/data/fd_picks.json
          git diff --cached --quiet && exit 0
          git commit -m "Daily shortlist"
          git pull --rebase origin main
          git push
